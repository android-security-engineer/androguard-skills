name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      run: |
        pip install poetry
        poetry config virtualenvs.create false

    - name: Install Dependencies (incl. dev)
      run: poetry install

    - name: Run tests (pytest) before publish
      run: poetry run pytest tests/ -q -p no:cacheprovider

    - name: Build packages (wheel + sdist)
      run: poetry build

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Androguard ${{ github.ref_name }}
        tag_name: ${{ github.ref }}
        generate_release_notes: true
        files: |
          dist/*.whl
          dist/*.tar.gz

    - name: Publish to PyPI
      # 注意：仅当配置了 secrets.PYPI_API_TOKEN 且 pyproject.toml / setup.py
      # 的 name 已从 "androguard" 改为 "androguard-skills"（上游占用 androguard）
      # 时才会上传成功。未配置 token 时此步自动跳过，不影响 GitHub Release。
      if: env.PYPI_API_TOKEN != ''
      run: |
        pip install twine
        twine upload dist/*
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
